[project]
name = "ai-uc-rpa-guidance"
version = "0.1.0"
description = "ai-uc-rpa-guidance"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgi-logger==0.1.0",
    "aws-embedded-metrics==3.5.0",
    "dnspython==2.9.0",
    "ecs-logging==2.3.0",
    "fastapi==0.143.2",
    "httpx==0.28.1",
    "pydantic-settings==2.16.0",
    "pymongo[aws,encryption,snappy,zstd]==4.19.0",
    "uvicorn==0.54.0",
    "aiohttp==3.14.5",
    "cryptography==50.0.2",
    "idna==3.20",
    "urllib3==2.8.0",
    "python-dotenv==1.2.4",
    "pygments==2.21.0",
    "pydantic-ai-slim[bedrock]==2.56.0",
    "aiofiles==25.1.0",
    "python-docx==1.2.0",
    "boto3==1.43.117",
]

[dependency-groups]
dev = [
    "debugpy==1.8.22",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.16.0",
    "pydantic-evals==2.56.0",
    "ruff==0.17.1",
    "taskipy==1.14.1",
    "testcontainers==4.15.0",
    "types-aiofiles==25.1.0.20260518",
]
scripts = [
    "openpyxl==3.1.5",
]
scraper = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "markdownify>=1.2.2",
]

[project.scripts]
ai-uc-rpa-guidance = "app.entrypoints.fastapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.coverage.run]
branch = true
include = ["app/*"]
omit = ["tests/*"]

[tool.coverage.html]
directory = "coverage/coverage_html"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.taskipy.tasks]
format = "uv run ruff format . && uv run ruff check . --fix"
lint = "uv run ruff format ./app ./tests --check && uv run ruff check ./app ./tests"
typecheck = "uv run mypy ./app ./tests"
test = "uv run task lint && uv run task typecheck && uv run coverage run -m pytest -vv && uv run coverage html && uv run coverage xml"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "pymongo.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aws_embedded_metrics.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.uv]
exclude-newer = "1 week"
# Exempt from the cooldown so the trust bundle can pick up eMudhra G3 intermediate
# revocations (https://blog.talosintelligence.com/compromised-intermediate-certificates/).
# Exempt boto3/botocore so we can take botocore 1.43.117, whose vendored CA bundle
# drops the Comodo AAA root that cross-signed the compromised eMudhra G3 root.
exclude-newer-package = { certifi = false, boto3 = false, botocore = false }
default-groups = ["dev", "scripts"]
